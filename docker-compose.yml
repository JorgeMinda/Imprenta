services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contabilidad
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  wasp:
    build: .
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.wasp
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/contabilidad
      JWT_SECRET: cambio_este_texto_por_otro_aleatorio
      WASP_SERVER_URL: http://localhost:3001
      WASP_WEB_CLIENT_URL: http://localhost:3000
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
