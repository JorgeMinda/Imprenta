services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contabilidad
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  wasp:
    build: .
    working_dir: /app
    volumes:
      - .:/app
      # Evita mezclar node_modules/.wasp del contenedor con el host.
      - /app/node_modules
      - /app/.wasp
    environment:
      # Wasp prioriza DATABASE_URL de .env.server, pero lo duplicamos por seguridad.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/contabilidad
      JWT_SECRET: dev-secret-change-me
    ports:
      - "3000:3000" # cliente (Vite)
      - "3001:3001" # servidor API
    depends_on:
      db:
        condition: service_healthy
    command: ["wasp", "start", "--no-dependent-start"]

volumes:
  pgdata:
