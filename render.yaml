# Render Blueprint — Motor Contable SRI (Ecuador)
# Wasp 0.24 + Prisma + Supabase Postgres. Despliegue en Render.
# Servicios: 1 API (server) + 1 cliente estático. DB externa = Supabase.

services:
  # ── API / Servidor Wasp ──────────────────────────────────────────────
  - type: web
    name: imprenta-server
    runtime: node
    plan: free
    branch: main
    buildCommand: >-
      npm config set prefix ~/npm-global &&
      export PATH="$HOME/npm-global/bin:$PATH" &&
      npm install -g @wasp.sh/wasp-cli@0.24 &&
      wasp install &&
      wasp build &&
      cd .wasp/out/server &&
      npm install &&
      npx prisma generate --schema=../db/schema.prisma &&
      npm run bundle
    startCommand: cd .wasp/out/server && npm run start-production
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WASP_SERVER_URL
        value: "https://imprenta-server.onrender.com"
      - key: WASP_WEB_CLIENT_URL
        value: "https://imprenta-client.onrender.com"
      - key: REACT_APP_API_URL
        value: "https://imprenta-server.onrender.com"

  # ── Cliente (React/Vite estático) ────────────────────────────────────
  - type: web
    name: imprenta-client
    runtime: static
    branch: main
    buildCommand: >-
      npm config set prefix ~/npm-global &&
      export PATH="$HOME/npm-global/bin:$PATH" &&
      npm install -g @wasp.sh/wasp-cli@0.24 &&
      wasp install &&
      wasp build &&
      npx vite build &&
      cp .wasp/out/web-app/build/200.html .wasp/out/web-app/build/index.html 2>/dev/null || true &&
      mkdir -p .wasp/build/web-app &&
      cp -r .wasp/out/web-app/build .wasp/build/web-app/
    staticPublishPath: .wasp/out/web-app/build
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: REACT_APP_API_URL
        value: "https://imprenta-server.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /200.html
