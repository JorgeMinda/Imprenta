# Render Blueprint — Motor Contable SRI (Ecuador)
# Estrategia: Render Blueprints (IaC), Wasp 0.25.0 en Native Node (sin Dockerfile mantenido a mano).
# Notas:
#   - Wasp separa server (API) y web-app (cliente estático) -> 2 servicios web + 1 DB.
#   - Wasp 0.21+ se instala vía npm con prefix escribible (~/.npm-global) para evitar
#     el `ENOENT ... /usr/lib/node_modules` que da el install global por defecto en Render.
#   - Node 24.14.1 es obligatorio para Wasp 0.25.0 (ver .nvmrc).
#   - Free tier NO soporta preDeployCommand -> las migraciones corren dentro de startCommand.
#   - Free tier NO soporta fromService.property=url -> se fijan las URLs *.onrender.com (deterministas por nombre de servicio).
# ⚠️ DB Free Tier expira a los 30 días: upgrade a $7/mes o migrar DATABASE_URL a Neon/Supabase.

services:
  # ── API / Servidor Wasp ──────────────────────────────────────────────
  - type: web
    name: imprenta-contable-server
    env: node
    plan: free
    branch: main
    buildCommand: bash -c 'export PATH="$HOME/.npm-global/bin:$PATH"; npm config set prefix ~/.npm-global >/dev/null 2>&1; npm install -g @wasp.sh/wasp-cli@0.25.0; cd "$(git rev-parse --show-toplevel)"; wasp build'
    # Migraciones + arranque (preDeployCommand no existe en free tier).
    startCommand: bash -c 'export PATH="$HOME/.local/bin:$PATH"; cd .wasp/build/server && npx prisma migrate deploy; node server.js'
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24.14.1"
      - key: DATABASE_URL
        value: "postgresql://doctoria_db_user:IBGdx5cDgyzdT4JqxA3CYHlC2AGK1jdj@dpg-d9utd4favr4c73bg8otg-a.oregon-postgres.render.com/doctoria_db?sslmode=require"
      - key: JWT_SECRET
        generateValue: true
      - key: WASP_SERVER_URL
        value: "https://imprenta-contable-server.onrender.com"
      - key: WASP_WEB_CLIENT_URL
        value: "https://imprenta-contable-client.onrender.com"

  # ── Cliente (React/Vite estático) ────────────────────────────────────
  - type: web
    name: imprenta-contable-client
    env: static
    branch: main
    buildCommand: bash -c 'export PATH="$HOME/.npm-global/bin:$PATH"; npm config set prefix ~/.npm-global >/dev/null 2>&1; npm install -g @wasp.sh/wasp-cli@0.25.0; cd "$(git rev-parse --show-toplevel)"; wasp build'
    staticPublishPath: .wasp/build/web-app
    envVars:
      - key: NODE_VERSION
        value: "24.14.1"
      - key: REACT_APP_API_URL
        value: "https://imprenta-contable-server.onrender.com"
