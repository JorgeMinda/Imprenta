services:
  - type: web
    name: imprenta-contable-sri
    env: node
    plan: free
    buildCommand: wasp build
    startCommand: node node/server.js
    
    # Comentarios eliminados para evitar problemas de parsing en Render.
    # La versión de Node 24 se gestiona con el Paso 3.

databases:
  - name: imprenta-db
    type: postgresql
    plan: free
