# Render Blueprint — Motor Contable SRI (Ecuador)
# Wasp 0.25.0 + Prisma + Supabase Postgres. Despliegue 100% en Render (sin Docker).
# Servicios: 1 API (web) + 1 cliente estático. DB externa = Supabase (sin service de DB en Render).
# Notas:
#   - Wasp 0.25.0 requiere main.wasp y Node 24.14.1.
#   - Free tier NO soporta preDeployCommand -> migraciones corren en startCommand (server-start.sh).
#   - DATABASE_URL/JWT_SECRET en sync:false -> se agregan manualmente en el dashboard (no van al repo).
#   - Wasp build genera los estáticos del cliente en .wasp/build/web-app/build.

services:
  # ── API / Servidor Wasp ──────────────────────────────────────────────
  - type: web
    name: imprenta-server
    env: node
    plan: free
    branch: main
    buildCommand: bash build.sh
    startCommand: bash server-start.sh
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24.14.1"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WASP_SERVER_URL
        value: "https://imprenta-server.onrender.com"
      - key: WASP_WEB_CLIENT_URL
        value: "https://imprenta-client.onrender.com"

  # ── Cliente (React/Vite estático) ────────────────────────────────────
  - type: web
    name: imprenta-client
    env: static
    branch: main
    buildCommand: bash build.sh
    staticPublishPath: .wasp/build/web-app/build
    envVars:
      - key: NODE_VERSION
        value: "24.14.1"
      - key: REACT_APP_API_URL
        value: "https://imprenta-server.onrender.com"
